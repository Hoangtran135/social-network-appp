name: Deploy to production

# Runs whenever a PR is merged into master (a merge produces a push event on master).
# Requires a self-hosted GitHub Actions runner installed on the Windows VPS — see
# setup-github-runner.md for the one-time setup steps.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: [self-hosted, windows, vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false # keep .env, uploads/, node_modules/ between runs — they're gitignored, not part of the repo

      - name: Install dependencies
        run: npm ci
        shell: pwsh

      - name: Build
        run: npm run build
        shell: pwsh

      - name: Restart app (or start it the first time)
        shell: pwsh
        run: |
          pm2 restart social-network-app --update-env
          if ($LASTEXITCODE -ne 0) {
            pm2 start ecosystem.config.cjs
          }
          pm2 save
